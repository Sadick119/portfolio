<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" fill="none">
  <defs>
    <linearGradient id="gnCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1e28"/>
      <stop offset="100%" stop-color="#141118"/>
    </linearGradient>
    <radialGradient id="gnGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FF2A4D" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0b0910" stop-opacity="0"/>
    </radialGradient>
    <filter id="gnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="16" flood-color="#8B5CF6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="translate(160, 15)" filter="url(#gnShadow)">
    <rect x="0" y="0" width="175" height="305" rx="28" fill="url(#gnCase)" stroke="#453244" stroke-width="2.5"/>
    <rect x="7" y="7" width="161" height="291" rx="22" fill="#0c0a11"/>
    <ellipse cx="87" cy="110" rx="70" ry="70" fill="url(#gnGlow)"/>

    <!-- Dynamic Island -->
    <rect x="62" y="14" width="50" height="11" rx="5.5" fill="#000000"/>

    <!-- App Top Bar: Dice / Game icon -->
    <rect x="22" y="36" width="14" height="14" rx="3" fill="#FF2A4D"/>
    <circle cx="29" cy="43" r="2" fill="#FFFFFF"/>
    <rect x="42" y="40" width="60" height="7" rx="2" fill="#FFFFFF"/>
    <circle cx="148" cy="43" r="8" fill="#241b2c"/>
    <path d="M 148 39 L 151 45 L 145 45 Z" fill="#FBBF24"/>

    <!-- Active Party Game Card -->
    <rect x="18" y="58" width="139" height="85" rx="12" fill="#181322" stroke="#FF2A4D" stroke-opacity="0.5" stroke-width="1.2"/>
    <rect x="28" y="68" width="55" height="5" rx="2" fill="#A78BFA"/>
    <rect x="28" y="78" width="85" height="12" rx="3" fill="#FFFFFF"/>
    
    <!-- Timer & Players -->
    <rect x="28" y="96" width="45" height="14" rx="7" fill="#FF2A4D"/>
    <rect x="78" y="96" width="45" height="14" rx="7" fill="#2d1c38" stroke="#8B5CF6" stroke-width="1"/>
    
    <!-- Question Progress Bar -->
    <rect x="28" y="122" width="119" height="5" rx="2.5" fill="#261b33"/>
    <rect x="28" y="122" width="75" height="5" rx="2.5" fill="#FF2A4D"/>

    <!-- Trivia Options Grid (4 Buttons) -->
    <rect x="18" y="152" width="66" height="34" rx="8" fill="#1b1526" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1"/>
    <rect x="26" y="166" width="50" height="5" rx="2" fill="#FFFFFF"/>
    
    <rect x="91" y="152" width="66" height="34" rx="8" fill="#FF2A4D" fill-opacity="0.2" stroke="#FF2A4D" stroke-width="1.2"/>
    <rect x="99" y="166" width="50" height="5" rx="2" fill="#FF2A4D"/>

    <rect x="18" y="192" width="66" height="34" rx="8" fill="#1b1526" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1"/>
    <rect x="26" y="206" width="50" height="5" rx="2" fill="#FFFFFF"/>

    <rect x="91" y="192" width="66" height="34" rx="8" fill="#1b1526" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1"/>
    <rect x="99" y="206" width="50" height="5" rx="2" fill="#FFFFFF"/>

    <!-- Live Scoreboard Bottom Strip -->
    <rect x="18" y="234" width="139" height="24" rx="6" fill="#14101e" stroke="#251a35" stroke-width="1"/>
    <circle cx="28" cy="246" r="4" fill="#FBBF24"/>
    <rect x="36" y="244" width="50" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="125" y="244" width="24" height="4" rx="2" fill="#10B981"/>

    <!-- Bottom Action Bar -->
    <rect x="18" y="266" width="139" height="24" rx="12" fill="#FF2A4D"/>
    <rect x="58" y="275" width="60" height="6" rx="3" fill="#FFFFFF"/>
  </g>
</svg>
