<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" fill="none">
  <defs>
    <linearGradient id="designerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140608"/>
      <stop offset="50%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#1c070c"/>
    </linearGradient>
    <radialGradient id="designerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2A4D" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#99001A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="dGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(40, 20)">
    <rect x="30" y="10" width="360" height="230" rx="10" fill="#141519" stroke="#2a2c34" stroke-width="2.5"/>
    <circle cx="210" cy="20" r="2.5" fill="#30323a"/>
    <rect x="42" y="30" width="336" height="198" rx="4" fill="url(#designerBg)"/>
    
    <!-- Designer Nav -->
    <rect x="58" y="42" width="50" height="7" rx="2" fill="#FFFFFF"/>
    <rect x="230" y="44" width="20" height="3" rx="1.5" fill="#6B7280"/>
    <rect x="260" y="44" width="20" height="3" rx="1.5" fill="#6B7280"/>
    <rect x="290" y="44" width="20" height="3" rx="1.5" fill="#6B7280"/>
    <rect x="325" y="40" width="40" height="11" rx="5.5" fill="#FF2A4D"/>

    <!-- Central Glowing Art Piece -->
    <ellipse cx="260" cy="135" rx="75" ry="55" fill="url(#designerGlow)" filter="url(#dGlow)"/>
    <path d="M 210 160 C 230 110, 290 100, 310 140 C 330 170, 260 190, 220 170" 
          stroke="#FF2A4D" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <circle cx="270" cy="130" r="22" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Hero Titles: Designer Portfolio -->
    <rect x="58" y="80" width="60" height="6" rx="2" fill="#FF2A4D"/>
    <rect x="58" y="94" width="140" height="12" rx="3" fill="#FFFFFF"/>
    <rect x="58" y="112" width="100" height="12" rx="3" fill="#FF2A4D"/>
    <rect x="58" y="132" width="130" height="4" rx="2" fill="#9CA3AF"/>
    <rect x="58" y="141" width="90" height="4" rx="2" fill="#6B7280"/>
    <rect x="58" y="154" width="60" height="13" rx="6.5" fill="#FFFFFF"/>

    <!-- Bottom Showcase thumbnails -->
    <rect x="58" y="180" width="60" height="36" rx="6" fill="#181922" stroke="#FF2A4D" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="126" y="180" width="60" height="36" rx="6" fill="#181922" stroke="#252733" stroke-width="1"/>
    <rect x="194" y="180" width="60" height="36" rx="6" fill="#181922" stroke="#252733" stroke-width="1"/>

    <!-- Laptop Lip Base -->
    <path d="M 0 240 L 420 240 L 390 256 L 30 256 Z" fill="#1e1f26" stroke="#32343e" stroke-width="1.5"/>
    <path d="M 175 241 L 245 241 L 240 245 L 180 245 Z" fill="#101115"/>
    <ellipse cx="210" cy="256" rx="160" ry="8" fill="#FF2A4D" opacity="0.18" filter="url(#dGlow)"/>
  </g>
</svg>
