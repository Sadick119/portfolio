<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" fill="none">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0509"/>
      <stop offset="60%" stop-color="#0e0f13"/>
      <stop offset="100%" stop-color="#2a060e"/>
    </linearGradient>
    <radialGradient id="p1ArtGlow" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FF1A3C" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#99001A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="p1Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Laptop Body (Angled 3D style) -->
  <g transform="translate(40, 20)">
    <!-- Screen Lid Border -->
    <rect x="30" y="10" width="360" height="230" rx="10" fill="#141519" stroke="#2a2c34" stroke-width="2.5"/>
    <!-- Camera -->
    <circle cx="210" cy="20" r="2.5" fill="#30323a"/>
    <!-- Screen display -->
    <rect x="42" y="30" width="336" height="198" rx="4" fill="url(#p1Grad)"/>
    
    <!-- Screen Content: Modern dark website -->
    <!-- Nav bar -->
    <rect x="52" y="40" width="40" height="8" rx="2" fill="#FF2A4B"/>
    <rect x="180" y="42" width="25" height="4" rx="2" fill="#666b7a"/>
    <rect x="215" y="42" width="25" height="4" rx="2" fill="#666b7a"/>
    <rect x="250" y="42" width="25" height="4" rx="2" fill="#666b7a"/>
    <rect x="330" y="38" width="36" height="12" rx="6" fill="#FF2A4B"/>
    
    <!-- Glowing Fluid Art on Web Screen -->
    <ellipse cx="250" cy="140" rx="90" ry="60" fill="url(#p1ArtGlow)" filter="url(#p1Glow)"/>
    <path d="M 180 160 C 210 110, 270 90, 310 130 C 340 160, 260 190, 210 170" 
          stroke="#FF2A4B" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    
    <!-- Hero Text Lines on Web Screen -->
    <rect x="62" y="85" width="130" height="12" rx="3" fill="#FFFFFF"/>
    <rect x="62" y="104" width="90" height="12" rx="3" fill="#FF2A4B"/>
    <rect x="62" y="125" width="110" height="4" rx="2" fill="#757a8a"/>
    <rect x="62" y="134" width="80" height="4" rx="2" fill="#585c6b"/>
    <rect x="62" y="148" width="50" height="14" rx="7" fill="#FF2A4B"/>
    
    <!-- Laptop Base / Lip -->
    <path d="M 0 240 L 420 240 L 390 256 L 30 256 Z" fill="#1e1f26" stroke="#32343e" stroke-width="1.5"/>
    <path d="M 175 241 L 245 241 L 240 245 L 180 245 Z" fill="#101115"/>
    <ellipse cx="210" cy="256" rx="160" ry="8" fill="#FF1A3C" opacity="0.15" filter="url(#p1Glow)"/>
  </g>
</svg>
