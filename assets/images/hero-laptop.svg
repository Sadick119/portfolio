<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" fill="none">
  <defs>
    <!-- Red glowing gradients -->
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="50%" stop-color="#FF113A"/>
      <stop offset="100%" stop-color="#99001A"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF1E42" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#E50914" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="screenAmbient" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2a050d"/>
      <stop offset="100%" stop-color="#0a0b0f"/>
    </radialGradient>
    <filter id="laserGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#FF113A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Ambient Red Halo -->
  <ellipse cx="480" cy="280" rx="320" ry="220" fill="url(#redGlow)" />

  <!-- Sweeping Neon Ribbon Paths (Back and around) -->
  <path d="M 60 480 C 180 560, 420 540, 680 430 C 820 360, 780 200, 640 160 C 500 120, 380 200, 400 320 C 420 440, 580 480, 740 400" 
        stroke="url(#neonRed)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.85" filter="url(#laserGlow)"/>
  <path d="M 120 450 C 260 520, 520 490, 700 360 C 800 290, 760 170, 620 180 C 480 190, 420 300, 450 380" 
        stroke="#FF6B8B" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Tilted Laptop Group with 3D transform perspective -->
  <g transform="matrix(0.96, -0.15, 0.22, 0.94, 20, 70)" filter="url(#softShadow)">
    
    <!-- Laptop Base / Bottom Chassis -->
    <path d="M 140 430 L 580 370 L 630 450 L 160 510 Z" fill="#131418" stroke="#2c2d33" stroke-width="2"/>
    <path d="M 160 510 L 630 450 L 635 458 L 163 518 Z" fill="#0d0e11" stroke="#3d3e45" stroke-width="1"/>
    
    <!-- Keyboard surface highlight -->
    <polygon points="180,432 550,382 590,442 200,490" fill="#18191f"/>
    <!-- Trackpad area -->
    <polygon points="320,455 450,438 465,472 335,488" fill="#141519" stroke="#25262c" stroke-width="1"/>
    
    <!-- Laptop Screen Lid Back Bevel -->
    <polygon points="160,110 570,55 580,380 170,435" fill="#16171c" stroke="#2e3038" stroke-width="3"/>
    
    <!-- Screen Inner Display -->
    <polygon points="175,125 555,75 565,365 185,415" fill="url(#screenAmbient)" stroke="#ff2a4b" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Screen Glass Shine & Glow -->
    <polygon points="175,125 400,95 240,405 185,415" fill="#ffffff" opacity="0.03"/>
    
    <!-- Glowing Code Symbol on Screen -->
    <g transform="translate(340, 220) scale(1.1)">
      <!-- Left Angle Bracket < -->
      <path d="M -40 -35 L -75 0 L -40 35" stroke="url(#neonRed)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#laserGlow)"/>
      <path d="M -40 -35 L -75 0 L -40 35" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <!-- Slash / -->
      <path d="M 12 -45 L -12 45" stroke="url(#neonRed)" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#laserGlow)"/>
      <path d="M 12 -45 L -12 45" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
      
      <!-- Right Angle Bracket > -->
      <path d="M 40 -35 L 75 0 L 40 35" stroke="url(#neonRed)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#laserGlow)"/>
      <path d="M 40 -35 L 75 0 L 40 35" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Subtle code lines on screen -->
    <rect x="200" y="150" width="80" height="4" rx="2" fill="#ff2a4b" opacity="0.6"/>
    <rect x="290" y="150" width="120" height="4" rx="2" fill="#505565" opacity="0.4"/>
    <rect x="220" y="165" width="140" height="4" rx="2" fill="#3e4352" opacity="0.4"/>
    <rect x="200" y="320" width="110" height="4" rx="2" fill="#3e4352" opacity="0.4"/>
    <rect x="320" y="320" width="60" height="4" rx="2" fill="#ff2a4b" opacity="0.5"/>
    <rect x="200" y="335" width="160" height="4" rx="2" fill="#505565" opacity="0.3"/>

    <!-- Screen top webcam dot -->
    <circle cx="365" cy="98" r="2.5" fill="#25262c"/>
  </g>

  <!-- Foreground Swooshes passing in front of laptop base -->
  <path d="M 300 480 C 440 520, 620 480, 750 390 C 830 330, 810 240, 730 220" 
        stroke="url(#neonRed)" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#laserGlow)" opacity="0.95"/>
  <path d="M 320 480 C 450 515, 610 475, 730 390" 
        stroke="#FFF" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8"/>
</svg>
