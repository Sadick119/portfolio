<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" fill="none">
  <defs>
    <linearGradient id="hallmarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="60%" stop-color="#080c18"/>
      <stop offset="100%" stop-color="#141e3d"/>
    </linearGradient>
    <radialGradient id="hallmarkGlow" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FF2A4D" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(40, 20)">
    <!-- Laptop Outer Lid -->
    <rect x="30" y="10" width="360" height="230" rx="10" fill="#141519" stroke="#2a2c34" stroke-width="2.5"/>
    <circle cx="210" cy="20" r="2.5" fill="#30323a"/>
    
    <!-- Screen -->
    <rect x="42" y="30" width="336" height="198" rx="4" fill="url(#hallmarkBg)"/>
    
    <!-- Hallmark School Nav -->
    <circle cx="58" cy="44" r="7" fill="#FF2A4D"/>
    <rect x="70" y="41" width="65" height="6" rx="2" fill="#FFFFFF"/>
    <rect x="220" y="42" width="22" height="4" rx="2" fill="#93C5FD"/>
    <rect x="250" y="42" width="22" height="4" rx="2" fill="#93C5FD"/>
    <rect x="280" y="42" width="22" height="4" rx="2" fill="#93C5FD"/>
    <rect x="320" y="38" width="46" height="12" rx="6" fill="#FF2A4D"/>
    
    <!-- Ambient School Hero Artwork -->
    <ellipse cx="260" cy="130" rx="80" ry="55" fill="url(#hallmarkGlow)" filter="url(#hGlow)"/>
    
    <!-- Hero Text -->
    <rect x="58" y="75" width="45" height="5" rx="2" fill="#38BDF8"/>
    <rect x="58" y="88" width="160" height="12" rx="3" fill="#FFFFFF"/>
    <rect x="58" y="105" width="130" height="10" rx="2.5" fill="#FF2A4D"/>
    <rect x="58" y="124" width="140" height="4" rx="2" fill="#94A3B8"/>
    <rect x="58" y="132" width="105" height="4" rx="2" fill="#64748B"/>
    <rect x="58" y="146" width="60" height="13" rx="6.5" fill="#FF2A4D"/>

    <!-- School Feature Mini-Cards -->
    <rect x="58" y="174" width="85" height="42" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="70" cy="186" r="4" fill="#38BDF8"/>
    <rect x="80" y="184" width="45" height="4" rx="2" fill="#FFFFFF"/>
    <rect x="70" y="196" width="60" height="3" rx="1.5" fill="#64748B"/>

    <rect x="150" y="174" width="85" height="42" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="162" cy="186" r="4" fill="#FF2A4D"/>
    <rect x="172" y="184" width="45" height="4" rx="2" fill="#FFFFFF"/>
    <rect x="162" y="196" width="60" height="3" rx="1.5" fill="#64748B"/>

    <rect x="242" y="174" width="85" height="42" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="254" cy="186" r="4" fill="#10B981"/>
    <rect x="264" y="184" width="45" height="4" rx="2" fill="#FFFFFF"/>
    <rect x="254" y="196" width="60" height="3" rx="1.5" fill="#64748B"/>
    
    <!-- Laptop Lip Base -->
    <path d="M 0 240 L 420 240 L 390 256 L 30 256 Z" fill="#1e1f26" stroke="#32343e" stroke-width="1.5"/>
    <path d="M 175 241 L 245 241 L 240 245 L 180 245 Z" fill="#101115"/>
    <ellipse cx="210" cy="256" rx="160" ry="8" fill="#FF2A4D" opacity="0.15" filter="url(#hGlow)"/>
  </g>
</svg>
