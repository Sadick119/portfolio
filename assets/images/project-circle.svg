<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" fill="none">
  <defs>
    <linearGradient id="circleCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#252733"/>
      <stop offset="100%" stop-color="#12131a"/>
    </linearGradient>
    <radialGradient id="circleGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FF2A4D" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#E50914" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a0a0e" stop-opacity="0"/>
    </radialGradient>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="16" flood-color="#FF2A4D" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="translate(160, 15)" filter="url(#cShadow)">
    <rect x="0" y="0" width="175" height="305" rx="28" fill="url(#circleCase)" stroke="#3e4152" stroke-width="2.5"/>
    <rect x="7" y="7" width="161" height="291" rx="22" fill="#0d0e12"/>
    <ellipse cx="87" cy="120" rx="70" ry="70" fill="url(#circleGlow)"/>

    <!-- Dynamic Island -->
    <rect x="62" y="14" width="50" height="11" rx="5.5" fill="#000000"/>

    <!-- App Top Bar: Circle Logo & Friends count -->
    <circle cx="28" cy="42" r="8" stroke="#FF2A4D" stroke-width="2.5" fill="none"/>
    <rect x="42" y="39" width="35" height="7" rx="2" fill="#FFFFFF"/>
    <circle cx="148" cy="42" r="9" fill="#1e2029"/>
    <circle cx="148" cy="42" r="4.5" fill="#10B981"/>

    <!-- Active Countdown Room Banner -->
    <rect x="18" y="60" width="139" height="58" rx="12" fill="#151720" stroke="#FF2A4D" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="28" y="70" width="60" height="5" rx="2" fill="#888E9E"/>
    <rect x="28" y="80" width="45" height="11" rx="2.5" fill="#FFFFFF"/>
    
    <!-- Countdown Timer badge -->
    <rect x="96" y="72" width="50" height="20" rx="10" fill="#FF2A4D" fill-opacity="0.18" stroke="#FF2A4D" stroke-width="1"/>
    <circle cx="106" cy="82" r="3" fill="#FF2A4D"/>
    <rect x="114" y="79" width="24" height="6" rx="2" fill="#FFFFFF"/>

    <!-- Friends Photo Moments Dump Grid -->
    <!-- Photo 1: Live Capture -->
    <rect x="18" y="128" width="66" height="74" rx="10" fill="#1a1c26" stroke="#2c2f3f" stroke-width="1"/>
    <circle cx="51" cy="158" r="14" stroke="#FF2A4D" stroke-width="2" fill="none"/>
    <circle cx="51" cy="158" r="6" fill="#FF2A4D"/>
    <rect x="26" y="188" width="50" height="4" rx="2" fill="#FFFFFF"/>

    <!-- Photo 2: Live Capture -->
    <rect x="91" y="128" width="66" height="74" rx="10" fill="#1a1c26" stroke="#2c2f3f" stroke-width="1"/>
    <circle cx="124" cy="158" r="14" stroke="#38BDF8" stroke-width="2" fill="none"/>
    <circle cx="124" cy="158" r="6" fill="#38BDF8"/>
    <rect x="99" y="188" width="50" height="4" rx="2" fill="#FFFFFF"/>

    <!-- Friend List / "Also on Circle" -->
    <rect x="18" y="210" width="139" height="38" rx="10" fill="#151720" stroke="#262835" stroke-width="1"/>
    <circle cx="34" cy="229" r="8" fill="#FF2A4D"/>
    <circle cx="50" cy="229" r="8" fill="#3B82F6"/>
    <circle cx="66" cy="229" r="8" fill="#10B981"/>
    <rect x="82" y="226" width="65" height="5" rx="2" fill="#CBD5E1"/>

    <!-- Camera Trigger Bottom Bar -->
    <rect x="18" y="258" width="139" height="30" rx="15" fill="#161722" stroke="#2a2c3a" stroke-width="1"/>
    <circle cx="87" cy="273" r="10" fill="#FF2A4D"/>
    <circle cx="87" cy="273" r="6" fill="#FFFFFF"/>
    <circle cx="45" cy="273" r="4" fill="#666C80"/>
    <circle cx="129" cy="273" r="4" fill="#666C80"/>
  </g>
</svg>
