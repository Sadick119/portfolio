<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" fill="none">
  <defs>
    <linearGradient id="phoneFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2c36"/>
      <stop offset="100%" stop-color="#14151a"/>
    </linearGradient>
    <radialGradient id="appRedGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FF2A4B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a0a0d" stop-opacity="0"/>
    </radialGradient>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#FF113A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="translate(160, 15)" filter="url(#phoneShadow)">
    <!-- Smartphone Case (tilted slightly) -->
    <rect x="0" y="0" width="175" height="305" rx="28" fill="url(#phoneFrame)" stroke="#3f4250" stroke-width="2.5"/>
    
    <!-- Screen -->
    <rect x="7" y="7" width="161" height="291" rx="22" fill="#0d0e12"/>
    <ellipse cx="87" cy="120" rx="70" ry="70" fill="url(#appRedGlow)"/>

    <!-- Dynamic Island / Speaker Notch -->
    <rect x="62" y="14" width="50" height="11" rx="5.5" fill="#000000"/>
    <circle cx="98" cy="19.5" r="2.5" fill="#1c1d24"/>

    <!-- App Header -->
    <rect x="22" y="38" width="45" height="6" rx="2" fill="#FFFFFF"/>
    <circle cx="148" cy="41" r="9" fill="#20222a"/>
    <circle cx="148" cy="41" r="5" fill="#FF2A4B"/>

    <!-- App Stats Card -->
    <rect x="20" y="58" width="135" height="65" rx="12" fill="#16171e" stroke="#FF2A4B" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="30" y="68" width="55" height="5" rx="2" fill="#888e9e"/>
    <rect x="30" y="78" width="40" height="12" rx="3" fill="#FFFFFF"/>
    <circle cx="120" cy="88" r="16" fill="none" stroke="#252733" stroke-width="5"/>
    <circle cx="120" cy="88" r="16" fill="none" stroke="#FF2A4B" stroke-width="5" stroke-dasharray="100" stroke-dashoffset="30"/>

    <!-- Task List Items -->
    <!-- Task 1 -->
    <rect x="20" y="132" width="135" height="34" rx="10" fill="#15161d" stroke="#262833" stroke-width="1"/>
    <circle cx="36" cy="149" r="6" fill="#FF2A4B"/>
    <rect x="50" y="144" width="70" height="4" rx="2" fill="#FFFFFF"/>
    <rect x="50" y="152" width="45" height="3" rx="1.5" fill="#707688"/>

    <!-- Task 2 -->
    <rect x="20" y="172" width="135" height="34" rx="10" fill="#15161d" stroke="#262833" stroke-width="1"/>
    <circle cx="36" cy="189" r="6" fill="#FF2A4B"/>
    <rect x="50" y="184" width="80" height="4" rx="2" fill="#FFFFFF"/>
    <rect x="50" y="192" width="50" height="3" rx="1.5" fill="#707688"/>

    <!-- Task 3 -->
    <rect x="20" y="212" width="135" height="34" rx="10" fill="#15161d" stroke="#262833" stroke-width="1"/>
    <circle cx="36" cy="229" r="6" fill="#444858"/>
    <rect x="50" y="224" width="60" height="4" rx="2" fill="#999eaf"/>
    <rect x="50" y="232" width="40" height="3" rx="1.5" fill="#505566"/>

    <!-- Bottom Navigation Bar -->
    <rect x="20" y="258" width="135" height="30" rx="15" fill="#161720" stroke="#2a2c3a" stroke-width="1"/>
    <circle cx="48" cy="273" r="4" fill="#FF2A4B"/>
    <circle cx="87" cy="273" r="4" fill="#666c80"/>
    <circle cx="126" cy="273" r="4" fill="#666c80"/>
  </g>
</svg>
